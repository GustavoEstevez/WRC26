{% extends 'canchas/base.html' %}
{% block content %}

<div class="card">
  <h2>{{ titulo }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% if form.instance.pk and form.instance.imagen %}
    <div class="mb-12">
      <img src="{{ form.instance.imagen.url }}" alt="{{ form.instance.nombre }}"
           class="w-full rounded-lg">
    </div>
    {% endif %}
    {{ form.as_p }}
    <div class="flex gap-10 mt-8">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a href="{% url 'lista_estadios' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
