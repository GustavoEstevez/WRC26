{% extends 'canchas/base.html' %}
{% block content %}

<div style="max-width:420px; margin:60px auto;">
  <div class="card">
    <h2>⚽ FIFA World Cup 2026</h2>
    <p style="margin-bottom:20px; color:#555;">Iniciá sesión para continuar</p>
    

    {% if form.errors %}
      <p style="color:#e94560; margin-bottom:12px;">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
        Ingresar
      </button>
      <p style="margin-top:16px; text-align:center; color:#555;">
  ¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a>
</p>
    </form>
  </div>
</div>

{% endblock %}
