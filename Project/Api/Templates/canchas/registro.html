{% extends 'canchas/base.html' %}
{% block content %}

<div style="max-width:420px; margin:60px auto;">
  <div class="card">
    <h2>⚽ Crear cuenta</h2>
    <p style="margin-bottom:20px; color:#555;">Completá los datos para registrarte</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
        Registrarse
      </button>
    </form>

    <p style="margin-top:16px; text-align:center; color:#555;">
      ¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a>
    </p>
  </div>
</div>

{% endblock %}
