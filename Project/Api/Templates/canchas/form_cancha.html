{% extends 'canchas/base.html' %}
{% block content %}

<div class="card">
  <h2>{{ titulo }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-10 mt-8">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a href="{% url 'lista_canchas' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
