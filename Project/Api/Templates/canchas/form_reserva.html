{% extends 'canchas/base.html' %}
{% block content %}

<div class="card">
  <h2>Reservar — Cancha {{ cancha.numero }} ({{ cancha.estadio.nombre }})</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-10 mt-8">
      <button type="submit" class="btn btn-primary">Confirmar reserva</button>
      <a href="{% url 'detalle_cancha' cancha.pk %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
